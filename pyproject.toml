[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssh-proxy"
version = "0.3.0"
description = "SSH OTP Local Proxy: authenticate OTP once, then connect freely without repeated prompts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.23.1",
    "rich>=15.0.0",
]

[project.scripts]
ssh-proxy = "ssh_proxy:main"

[tool.hatch.build.targets.wheel]
only-include = ["ssh_proxy.py"]
