name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.3.1)'
        required: false
        default: 'v0.3.1'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            binary_src: dist/ssh-proxy.exe
            binary_dest: ssh-proxy-windows-x64.exe
          - os: macos-latest
            target: macos-arm64
            binary_src: dist/ssh-proxy
            binary_dest: ssh-proxy-macos-arm64
          - os: ubuntu-latest
            target: linux-x64
            binary_src: dist/ssh-proxy
            binary_dest: ssh-proxy-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build standalone executable with PyInstaller
        run: uv run pyinstaller --onefile --name ssh-proxy --clean ssh_proxy.py

      - name: Prepare binary for upload
        shell: bash
        run: |
          mkdir -p artifacts
          cp "${{ matrix.binary_src }}" "artifacts/${{ matrix.binary_dest }}"
          chmod +x "artifacts/${{ matrix.binary_dest }}" || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_dest }}
          path: artifacts/${{ matrix.binary_dest }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine tag name
        id: vars
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          if [ -n "$INPUT_TAG" ]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
            ssh_config.example
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

