name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            binary_src: dist/ssh-proxy.exe
            binary_dest: ssh-proxy-windows-x64.exe
          - os: macos-14
            target: macos-arm64
            binary_src: dist/ssh-proxy
            binary_dest: ssh-proxy-macos-arm64
          - os: macos-13
            target: macos-x64
            binary_src: dist/ssh-proxy
            binary_dest: ssh-proxy-macos-x64
          - os: ubuntu-latest
            target: linux-x64
            binary_src: dist/ssh-proxy
            binary_dest: ssh-proxy-linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Build standalone executable with PyInstaller
        run: uv run pyinstaller --onefile --name ssh-proxy --clean ssh_proxy.py

      - name: Prepare binary for upload
        shell: bash
        run: |
          mkdir -p artifacts
          cp "${{ matrix.binary_src }}" "artifacts/${{ matrix.binary_dest }}"
          chmod +x "artifacts/${{ matrix.binary_dest }}" || true

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_dest }}
          path: artifacts/${{ matrix.binary_dest }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'latest-build' }}
          name: Release ${{ github.ref_name || 'Latest Build' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
